{% extends "base.html" %}
{% block title %}Delete {{ singular }}{% endblock %}
{% block crumb %} / <a href="{{ list_url }}">{{ title }}</a> / Delete{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Delete {{ singular }}?</h1></div></div>
<div class="panel" style="max-width:560px"><div class="panel-body">
  <p>You are about to permanently delete <strong>{{ object }}</strong>. This can't be undone.</p>
  <form method="post" class="d-flex gap-2">{% csrf_token %}
    <button class="btn btn-danger">Delete {{ singular }}</button>
    <a href="{{ list_url }}" class="btn btn-ghost">Keep it</a>
  </form>
</div></div>
{% endblock %}
