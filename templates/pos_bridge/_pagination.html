{% if page_obj and page_obj.paginator.num_pages > 1 %}
<nav class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-3" aria-label="Table pages"><small class="text-muted">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }} · {{ page_obj.paginator.count }} records</small><div class="btn-group btn-group-sm">
{% if page_obj.has_previous %}<a class="btn btn-outline-secondary" href="?page={{ page_obj.previous_page_number }}&amp;{{ query_string }}"><i class="bi bi-chevron-left"></i> Previous</a>{% else %}<button class="btn btn-outline-secondary" disabled>Previous</button>{% endif %}
{% if page_obj.has_next %}<a class="btn btn-outline-secondary" href="?page={{ page_obj.next_page_number }}&amp;{{ query_string }}">Next <i class="bi bi-chevron-right"></i></a>{% else %}<button class="btn btn-outline-secondary" disabled>Next</button>{% endif %}
</div></nav>
{% endif %}
