{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<div class="panel mx-auto mt-4" style="max-width:560px"><div class="panel-body text-center py-5">
  <i class="bi {{ icon }}" style="font-size:2.6rem;color:var(--muted)"></i>
  <h1 class="h3 mt-3">{{ heading }}</h1>
  <p class="text-muted mb-4">{{ message }}</p>
  <div class="d-flex gap-2 justify-content-center">
    <a href="{% url 'dashboard' %}" class="btn btn-ghost">Back to dashboard</a>
    <form method="post" action="{% url 'logout' %}" class="m-0">{% csrf_token %}<button class="btn btn-hivis">Sign out</button></form>
  </div>
</div></div>
{% endblock %}
