{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Change password</h1></div></div>
<form method="post" class="panel" style="max-width:520px">{% csrf_token %}
  <div class="panel-body">
    {% for f in form %}
    <div class="mb-3">
      <label class="form-label" for="{{ f.id_for_label }}">{{ f.label }}</label>
      <input type="password" name="{{ f.html_name }}" id="{{ f.id_for_label }}" class="form-control" required>
      {% for e in f.errors %}<div class="text-danger small mt-1">{{ e }}</div>{% endfor %}
      {% if f.help_text %}<div class="form-text">{{ f.help_text|safe }}</div>{% endif %}
    </div>
    {% endfor %}
    <button class="btn btn-hivis px-4">Update password</button>
  </div>
</form>
{% endblock %}
